name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-android:
    name: Export Android debug APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          ls -la /root/.local/share/godot/export_templates/ || true
          cp -r /root/.local/share/godot/export_templates/. ~/.local/share/godot/export_templates/
          ls -la ~/.local/share/godot/export_templates/

      - name: Setup Android signing and editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          godot --headless --editor --quit || true
          SETTINGS=$(ls ~/.config/godot/editor_settings-*.tres 2>/dev/null | head -n 1 || true)
          if [ -z "$SETTINGS" ]; then
            SETTINGS=~/.config/godot/editor_settings-4.3.tres
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          {
            echo "export/android/android_sdk_path = \"${ANDROID_HOME:-/usr/lib/android-sdk}\""
            echo "export/android/debug_keystore = \"$GITHUB_WORKSPACE/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
            echo "export/android/force_system_user = false"
            echo "export/android/shutdown_adb_on_exit = true"
          } >> "$SETTINGS"

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Export APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/mini-restorer-debug.apk
          ls -la build/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-restorer-apk
          path: build/android/*.apk

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/android/mini-restorer-debug.apk
